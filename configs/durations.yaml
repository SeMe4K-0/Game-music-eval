durations_s: [15, 30, 60, 90, 120]
game_loop_window_s: [30, 90]   # рабочее окно типичного игрового лупа

# Единая частота дискретизации для метрик групп 3-4 (DSP, CPU). Все треки всех
# моделей (16/32/44.1/48 кГц) ресемплируются сюда перед анализом, иначе
# спектральные расстояния и onset-детекция несопоставимы между моделями.
analysis_sr: 22050
# Пиковая нормализация перед записью wav и перед анализом: разные модели
# отдают сигнал с разной громкостью (и с пиками >1.0, что клиппится при записи
# в PCM16). Нормализуем к этому пику.
peak_normalize_to: 0.9

# ---------------------------------------------------------------------------
# Единица наблюдения для FAD/KAD — НАБОР (set) уровня (модель × длительность),
# объединяющий все промпты: 8 промптов × N треков = 96 файлов на набор.
# Считать FAD на 12 файлах одного промпта нельзя: ковариация 512-мерных
# CLAP-эмбеддингов по 12 точкам вырождена. Промпт как фактор анализируется
# только по per-track метрикам (CLAP, шов, такт, структура).
# ---------------------------------------------------------------------------
N_tracks_per_prompt_per_set: 12
factorial_plan:
  full_K: 5
  reduced_K: 3
  full_K_cells:
    models: [musicgen_small, ace_step_v1_3_5b]
    durations_s: [15, 30, 60, 90, 120]
  reduced_K_cells:         # периферийные длительности у дорогих моделей — K=3
    models: [audioldm2_music, riffusion_v1, stable_audio_open_1_0]
    durations_s: [15, 120]
  default_K: 5

# Схема сидов: seed = seed_base + 100000*set_idx + 1000*prompt_idx + track_idx.
# Уникальны между наборами (иначе для детерминированных пайплайнов diffusers
# наборы 0..K-1 будут побайтно одинаковыми и межнаборный разброс = 0).
# Одинаковы между длительностями и моделями (common random numbers).
seed_base: 20260904

bootstrap_resamples: 1000
reference_segments_per_duration: 1000   # окон референса на каждую длительность

# ---------------------------------------------------------------------------
# Решающее правило (фиксируется ДО прогона; применяется механически)
# ---------------------------------------------------------------------------
decision_rule:
  # Промпты-стингеры (fanfare) не зацикливаются по определению — исключаются
  # из шовных/тактовых условий, но участвуют в CLAP и дистанционных метриках.
  loop_prompt_categories: [combat, exploration, location]
  # Условие 1 (шов): для обоих окон (50 и 200 мс) спектральный разрыв на шве
  # не превышает 95-й перцентиль внутритрековых переходов того же масштаба
  # (шов неотличим от 95% собственных переходов трека) И щелчок на стыке не
  # больше самых сильных транзиентов самого трека (click_ratio <= 1).
  # Условие оценивается по ДОЛЕ треков, прошедших его, с бутстрап-CI;
  # порог доли — ниже.
  seam_pass_fraction_min: 0.5
  # Условие 2 (такт): щель на шве в долях (локальная кратность, устойчива к
  # дрейфу темпа) отклоняется от целого <= 0.1 доли И длительность кратна
  # такту (4/4) с точностью 0.1 такта.
  seam_gap_beat_error_max: 0.10
  bar_fraction_error_max: 0.10
  grid_pass_fraction_min: 0.5
  # Условие 3 (домен/текст): CLAP score модели на промпте выше медианы по всем
  # моделям на том же промпте (относительное условие).
  # Условия 1-2 считаются и для "как есть" (наивная петля), и для "после
  # наилучшего реза" (извлекаемая петля) — раздельно, обе версии в таблице.
